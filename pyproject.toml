[project]
name = "music-analytics"
version = "0.1.0"
description = "Conversational analytics over the MusicBrainz database using an Apache Ossie semantic layer"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "claude-agent-sdk>=0.2.128",
    "apache-ossie @ git+https://github.com/apache/ossie#subdirectory=python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "semantic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
